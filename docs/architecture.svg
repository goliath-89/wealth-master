<rect class="gray-f" x="190" y="600" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="622" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
<text class="ts gray-s" x="340" y="640" text-anchor="middle" dominant-baseline="central">scheduled rates and FX pull</text>
</svg>
