<svg xmlns="http://www.w3.org/2000/svg" width="680" height="696" viewBox="0 0 680 696" role="img">
<title>Wealth Master solution architecture</title>
<desc>Devices load a static app from GitHub Pages. The app runs entirely in the browser with a store, sync engine, calculation engine and chart engine, backed by a localStorage cache. It syncs bidirectionally with a Google Sheet acting as system of record, holding entity tabs and a reference tab. A GitHub Actions job writes reference data into that sheet on a schedule.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.gray-f{fill:#F1EFE8;stroke:#5F5E5A}
.gray-t{fill:#2C2C2A}.gray-s{fill:#5F5E5A}
.purple-f{fill:#EEEDFE;stroke:#534AB7}.purple-t{fill:#3C3489}
.blue-f{fill:#E6F1FB;stroke:#185FA5}.blue-t{fill:#0C447C}
.teal-f{fill:#E1F5EE;stroke:#0F6E56}.teal-t{fill:#085041}
.green-f{fill:#EAF3DE;stroke:#3B6D11}.green-t{fill:#27500A}
</style>
</defs>
