name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Browsers cache js/ and css/ independently of index.html, so a return visitor can
      # end up running last week's app.js against today's markup — a button that renders
      # and does nothing. Stamping the commit into every asset URL makes each deploy a
      # new URL, so the pair can never be mismatched. Local checkouts keep "?v=dev".
      - name: Stamp asset URLs with the deployed commit
        run: |
          set -e
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
          if grep -q "?v=dev" index.html; then echo "an asset URL was left unstamped"; exit 1; fi
          grep -c "?v=${GITHUB_SHA::8}" index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
