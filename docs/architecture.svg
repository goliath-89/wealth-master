<text class="th gray-t" x="145" y="62" text-anchor="middle" dominant-baseline="central">Laptop</text>
<text class="ts gray-s" x="145" y="80" text-anchor="middle" dominant-baseline="central">month-end entry</text>
<rect class="gray-f" x="255" y="40" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="62" text-anchor="middle" dominant-baseline="central">Phone</text>
<text class="ts gray-s" x="340" y="80" text-anchor="middle" dominant-baseline="central">quick check</text>
<rect class="gray-f" x="450" y="40" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="535" y="62" text-anchor="middle" dominant-baseline="central">Tablet</text>
<text class="ts gray-s" x="535" y="80" text-anchor="middle" dominant-baseline="central">review</text>
<line x1="145" y1="96" x2="238" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="96" x2="442" y2="126" class="arr" marker-end="url(#arrow)"/>
<rect class="gray-f" x="180" y="130" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="152" text-anchor="middle" dominant-baseline="central">GitHub Pages</text>
<text class="ts gray-s" x="340" y="170" text-anchor="middle" dominant-baseline="central">static hosting, code only</text>
<line x1="340" y1="186" x2="340" y2="216" class="arr" marker-end="url(#arrow)"/>
<rect class="purple-f" x="40" y="220" width="600" height="190" rx="20" stroke-width="0.5"/>
<text class="th purple-t" x="340" y="248" text-anchor="middle" dominant-baseline="central">Wealth Master app</text>
<rect class="blue-f" x="63" y="278" width="128" height="44" rx="8" stroke-width="0.5"/>
<text class="th blue-t" x="127" y="300" text-anchor="middle" dominant-baseline="central">Store</text>
